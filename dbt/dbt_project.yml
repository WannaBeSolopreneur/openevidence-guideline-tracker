name: guideline_tracker
version: "1.0.0"
config-version: 2
profile: guideline_tracker
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  on_track_ratio: 0.95
  at_risk_ratio: 0.80

models:
  guideline_tracker:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  guideline_tracker:
    +schema: seed
